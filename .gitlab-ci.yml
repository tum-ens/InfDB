# .gitlab-ci.yml
# All jobs run on the Proxmox project runner (tag infdb-proxmox, shell executor).

# Global variables
variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"

# Default tags for all jobs
default:
  tags:
    - infdb-proxmox

# Ensure uv is available on shell runners (installs to ~/.local/bin if missing)
before_script:
  - export PATH="$HOME/.local/bin:$PATH"
  - command -v uv || curl -LsSf https://astral.sh/uv/install.sh | sh
  - uv sync --group test


# Cache configuration
cache:
  paths:
    - .cache/pip
    - .cache/uv

# Stages
stages:
  - setup
  - test
  - lint
  - docs

# Verify the environment before running the checks. Each job recreates its own venv.
setup:
  stage: setup
  script:
    - uv pip check

## Test job
test:
  stage: test
  script:
    - source .venv/bin/activate
    - pytest --cov=src --cov-report=xml --cov-report=html --junitxml=junit.xml
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    when: always
    reports:
      junit: junit.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - htmlcov/
    expire_in: 1 week

pre-commit-hook:
  stage: lint
  script:
    - git --version  # Provision Git on the runner host, not from an unprivileged job.
    - source .venv/bin/activate
    - pre-commit run --all-files
  allow_failure: true

# Linting job
lint:
  stage: lint
  script:
    - source .venv/bin/activate
    - |
      result=0
      ruff check . || result=$?
      ruff format --check . || result=$?
      exit "$result"
  allow_failure: true

# Type checking
type-check:
  stage: lint
  script:
    - source .venv/bin/activate
    - mypy src
    - mypy tests
    - mypy services/infdb-api/fastapi
    - mypy services/infdb-api/postgrest
    - mypy services/infdb-api/pygeoapi
    - mypy tools/infdb-basedata-buildings
    - mypy tools/infdb-basedata-ways
    #- mypy tools/infdb-import
    #- mypy tools/infdb-metadata
    #- mypy tools/buildings-to-street
    # - mypy tools/kwp
    - mypy tools/ro-heat
    - mypy tools/linear-heat-density
    #- mypy tools/sunpot

  allow_failure: true

# Security checks remain advisory pending the documented baseline review.
# B608: SQL strings in Python is used a lot, ideally should be refactored: https://bandit.readthedocs.io/en/latest/plugins/b608_hardcoded_sql_expressions.html

security:
  stage: lint
  script:
    - source .venv/bin/activate
    # Scan this repository's tracked Python sources. Submodule repositories need separate scans.
    - |
      result=0
      git ls-files -z -- '*.py' | xargs -0 bandit --severity-level medium --skip B608 -- || result=$?
      safety scan || result=$?
      exit "$result"
  allow_failure: true


pages:
  stage: docs
  script:
    - source .venv/bin/activate
    - mkdocs build -f docs/mkdocs/mkdocs.yml --site-dir ../../public
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/uv/
  artifacts:
    paths:
      - public
