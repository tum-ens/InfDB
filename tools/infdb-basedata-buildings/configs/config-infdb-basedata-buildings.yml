infdb-basedata-buildings:
    config-infdb: "config-infdb.yml" # only filename - change path in ".env" file "CONFIG_INFDB_PATH"
    logging:
        path: "infdb-basedata-buildings.log"
        level: "INFO" # ERROR, WARNING, INFO, DEBUG
    hosts:
        postgres:
            user: None
            password: None
            db: None
            host: None
            exposed_port: None
            epsg: None # 3035 (Europe)
    data:
        input_schema: opendata
        output_schema: basedata
        census_building_type_resolution: 1km #1km, 100m
        random_seed: 0.98 # Seed value used for the random assignment of construction periods
    mixed_use:
        status: active          # set to anything else to disable mixed-use promotion

        # 1) WHICH signals mark a building as structurally unable to house
        #    anyone. Every candidate is promoted to Mixed by default; only a
        #    candidate that carries one of these is left Unknown. See
        #    06_z_fill_mixed_use.sql STEP 1 for how each is computed.
        non_residential_indicators:
            - in_industrial_area          # inside a basemap IndustrieUndGewerbeflaeche
            - in_cemetery                 # inside a basemap Friedhof
            - in_sport_leisure_area       # inside a basemap SportFreizeitUndErholungsflaeche
            - in_mining_area              # inside a basemap TagebauGrubeSteinbruch or Halde
            - institutional_strict        # inside a basemap Kultur / Sicherheit und Ordnung /
                                           # Regierung und Verwaltung area
            - osm_nonresidential          # OSM tags the footprint office/retail/commercial/
                                           # industrial/warehouse/kiosk/supermarket
            - osm_institutional_technical # OSM tags the footprint a school, hospital, museum,
                                           # government office or other technical/institutional use

        # 2) WHETHER an AGS trusts each indicator at all. An indicator is only
        #    applied in an AGS if fewer than this share of that AGS's own
        #    LOD2-Residential stock (floor_number >= 2) also carries it --
        #    otherwise it would throw away real housing there and is skipped
        #    for that AGS. 
        
        #    The 1% bound is a free assumption, not a derived
        #    value: it reads as "essentially never coincides with a dwelling"
        #    and can be calibrated.
        #    Raising it trusts more indicators (more candidates stay Unknown),
        #    lowering it trusts fewer (more candidates become Mixed).
        max_false_positive_rate: 0.01

        # 3) HOW the floor area is split. No source measures this, so the split
        #    rests on structural assumptions.
        share:
            commercial_floors_default: 1     # commercial ground floor, residential above
            commercial_floors_pedestrian: 2  # 1a-Lage retail extends one floor up
            pedestrian_buffer_m: 25          # distance to a basemap Fussgaengerzone that counts as 1a-Lage
            # German real-estate practice calls a building a Wohn- und Geschaeftshaus only
            # while both uses are substantial, so the share is clamped into that band.
            min_residential_share: 0.2       # guard: keeps a two-storey pedestrian-zone building mixed, mixed building always keeps a residential part
            max_residential_share: 0.8       # above this the building keeps a 0.8/0.2 split
