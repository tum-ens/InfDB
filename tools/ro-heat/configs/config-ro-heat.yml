# Configuration file for ro-heat
#
# This configuration file contains tool-specific settings and database connection parameters.
#
# Database Connection Parameters:
# - Parameters set to 'None' will be automatically replaced with values from the central
#   configuration file specified in 'config-infdb' (config-infdb.yml by default)
# - This approach allows you to run locally using centralized database settings
# - To connect to a remote infdb instance, replace 'None' values with your specific
#   connection parameters (user, password, db, host, exposed_port, epsg)
#
ro-heat:
    config-infdb: "config-infdb.yml" # only filename - change path in ".env" file "CONFIG_INFDB_PATH"
    logging:
        path: "ro-heat.log"
        level: "INFO" # ERROR, WARNING, INFO, DEBUG
    hosts:
        postgres:
            user: None
            password: None
            db: None
            host: None
            exposed_port: None
            epsg: None
    data:
        input:
            schema: basedata
            simulation_year: 2023
            heating_setpoint: 20.0 # heating setpoint in °C
            random_seed: 42 # explain this value
            method: 1R1C # 1R1C or 1R0C or 1R0C_internal
            Heated_Area_Ratio: 0.8 # ratio of heated area to total area (0-1)
        refurbishment:
            outer_wall:
                quota: 0.33
                lifespan_mean: 40
                lifespan_spread: 10
            rooftop:
                quota: 0.63
                lifespan_mean: 50
                lifespan_spread: 10
            window:
                quota: 0.9
                lifespan_mean: 30
                lifespan_spread: 10
        output:
            schema: ro_heat   # needs to be snake_case
        # ── EnTiSe storage ───────────────────────────────────────────────────────
        # ro-heat hands its DB engine + this block to EnTiSe, which computes the time
        # series and (optionally) streams them into the DB via COPY. Target schema comes
        # from data.output.schema above. [EnTiSe] keys map onto EnTiSe's StorageConfig;
        # [ro-heat] keys are consumed here and not passed to EnTiSe.
        storage:
            store_timeseries: true               # [ro-heat] false = store summary only; true = also store the full time series
            ts_type: hvac                        # [EnTiSe] result type to read: {object_id: {ts_type: DataFrame}}
            source: ro-heat                      # [EnTiSe] metadata 'source' + part of unique key (name+objectid+source)
            data_table: entise_ts_data           # [EnTiSe] holds (ts_metadata_id, time, value) rows
            metadata_table: entise_ts_metadata   # [EnTiSe] one row per (building, series)
            index_name: entise_ts_data_idx       # [EnTiSe] dropped before load, rebuilt once after (index-once)
            stream_chunk_size: 500               # [EnTiSe] buildings computed + COPY-ed per chunk (bounds RAM)
            store_plz: []                        # [ro-heat] only process these postcodes; [] = all buildings in the AGS

            # [EnTiSe] column-to-series mapping (the domain-specific part). For each
            # EnTiSe output column we store, this declares the DB series + metadata:
            #   column      -> column in EnTiSe's per-object DataFrame (the value source)
            #   name        -> series name written to metadata_table
            #   description -> human-readable description (metadata)
            #   type        -> series type (metadata)
            #   unit        -> physical unit (metadata)
            series:
                - column: "indoor_temperature[C]"
                  name: ro_heat_indoor_temperature
                  description: "Indoor temperature for building"
                  type: synthetic
                  unit: "°C"
                - column: "heating:load[W]"
                  name: ro_heat_heating_load
                  description: "Heating load for building"
                  type: synthetic
                  unit: "W"
                - column: "cooling:load[W]"
                  name: ro_heat_cooling_load
                  description: "Cooling load for building"
                  type: synthetic
                  unit: "W"
