# Configuration file for infdb-fdw-setup
#
# This configuration file contains tool-specific settings and database connection parameters.
#
# Database Connection Parameters:
# - Parameters set to 'None' will be automatically replaced with values from the central
#   configuration file specified in 'config-infdb' (config-infdb.yml by default)
# - This approach allows you to run locally using centralized database settings
# - To connect to a remote infdb instance, replace 'None' values with your specific
#   connection parameters (user, password, db, host, exposed_port, epsg)
#
infdb-fdw-setup:
    config-infdb: "config-infdb.yml" # only filename - change path in ".env" file "CONFIG_INFDB_PATH"
    logging:
        path: "infdb-fdw-setup.log"
        level: "INFO" # ERROR, WARNING, INFO, DEBUG
    hosts:
        postgres:
            user: None
            password: None
            db: None
            host: None
            exposed_port: None
            epsg: None
    fdw:
        status: active # set to "inactive" to disable FDW setup
        central_db:
            host: "host.docker.internal"  # Central InfDB instance host
            port: 54328  # Central InfDB instance port
            db: "infdb"  # Central InfDB database name
            user: "infdb_user"  # Central InfDB user
            password: "infdb"  # Central InfDB password
        foreign_schema: "opendata"  # Schema to import via FDW
        local_schema: "opendata_fdw"  # Local schema name for FDW mapping
        read_only: true # default is True - set to False to allow write access to foreign tables (not recommended for production)