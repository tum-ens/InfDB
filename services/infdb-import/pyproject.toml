[project]
name = "loader"
version = "1"
requires-python = "==3.12.*"
dependencies = [
    "geopandas",
    "pandas",
    "psycopg2-binary",
    "sqlalchemy>=2.0,<2.1",  # 2.1 breaks pandas.to_sql and defaults to psycopg3
    "requests",
    "beautifulsoup4",
    "python-dotenv>=1.2.2,<2",
    "geoalchemy2==0.17.1",
    "PyYAML",
    "chardet",
    "pysmartdl",
    "openmeteo-requests",
    "requests-cache",
    "retry-requests",
    "numpy",
    "wetterdienst==0.87.0",
    "duckdb>=1.0.0",
    "marshmallow>=3.13,<4",
    "charset-normalizer",
    "pyinfdb",
]

[tool.uv.sources]
pyinfdb = { path = "/workspaces/infdb_package", editable = true }
